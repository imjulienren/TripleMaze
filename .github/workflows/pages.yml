name: Deploy WebGL to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Prepare WebGL static files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, copyFileSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          mkdirSync('_site/Build', { recursive: true });
          mkdirSync('_site/TemplateData', { recursive: true });
          for (const name of readdirSync('Build')) {
            const input = readFileSync('Build/' + name);
            writeFileSync('_site/Build/' + name.replace(/\.br$/, ''), name.endsWith('.br') ? brotliDecompressSync(input) : input);
          }
          for (const name of readdirSync('TemplateData')) copyFileSync('TemplateData/' + name, '_site/TemplateData/' + name);
          writeFileSync('_site/index.html', readFileSync('index.html', 'utf8').replaceAll('.br', ''));
          writeFileSync('_site/.nojekyll', '');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
